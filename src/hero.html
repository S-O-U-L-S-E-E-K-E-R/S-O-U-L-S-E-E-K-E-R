        radial-gradient(ellipse at 70% 20%, #121114 0%, var(--page) 55%);}
  #panel{position:absolute;left:10px;top:62px;width:1280px;height:770px}
  .abs{position:absolute}
  .mono{font-family:'Share Tech Mono',monospace}
  .box{position:absolute;left:0;width:1280px;background:var(--box);border:1px solid var(--bd)}
  .kebab{position:absolute;display:flex;gap:3px}
  .kebab i{width:3px;height:3px;border-radius:50%;background:#b9b9b9;display:block}
  .brk{position:absolute;width:15px;height:15px;border-color:var(--red);border-style:solid;border-width:0}
  .brk.tl{border-top-width:2px;border-left-width:2px}

  /* hero text */
  .classified{left:64px;top:46px;color:var(--red);font-size:11px;letter-spacing:3.2px}
  .title{left:33px;top:66px;font-family:'Saira Stencil One',sans-serif;color:var(--cream);
         font-size:71.4px;line-height:1;letter-spacing:1px;white-space:nowrap;transform-origin:left top}
  .tagline{left:33px;top:145px;font-family:'Saira',sans-serif;font-weight:500;color:var(--cream);
           font-size:26px;line-height:1;letter-spacing:8px;white-space:nowrap}
  .lbl{top:192px;color:var(--g2);font-size:12px;letter-spacing:2.4px;white-space:nowrap}

  .status{left:1122px;top:43px;width:144px;height:27px;border:1px solid #2f6b3a;border-radius:5px;background:#0c140e;
          display:flex;align-items:center;gap:9px;padding-left:11px;color:#d7e4d6;font-size:10.5px;letter-spacing:1.8px}
  .status i{width:9px;height:9px;border-radius:50%;background:#3fd16b;box-shadow:0 0 7px #3fd16b;display:block}
  .rcol{left:1208px;top:90px;color:var(--g2);font-size:9.6px;letter-spacing:1.6px;line-height:16px;white-space:nowrap}

  /* section headers */
  .shead{color:var(--g1);font-size:11.5px;letter-spacing:3.4px}
  .sright{color:var(--g3);font-size:9px;letter-spacing:1.6px}

  /* cards */
  .card{position:absolute;width:620px;height:166px;background:var(--card);border:1px solid var(--bd2)}
  .card .no{position:absolute;left:19px;top:10px;font-family:'Chakra Petch',sans-serif;font-weight:700;color:var(--red);font-size:17px;letter-spacing:.5px}
  .card .proj{position:absolute;left:62px;top:11px;color:var(--g1);font-size:10px;letter-spacing:2.2px}
  .card h3{position:absolute;left:61px;top:27px;font-family:'Russo One',sans-serif;font-weight:400;color:var(--cream);
           font-size:25.5px;letter-spacing:1.6px;white-space:nowrap}
  .chip{position:absolute;left:62px;top:65px;height:22px;border:1px solid #a51f24;border-radius:4px;
        display:flex;align-items:center;gap:10px;padding:0 14px 0 10px;color:var(--red);font-size:10px;letter-spacing:2.2px;background:#150c0d}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--red);display:block}
  .desc{position:absolute;left:62px;top:96px;width:250px;font-family:'Inter',sans-serif;color:#a8a6a1;font-size:12.6px;line-height:18px}
  .lang{position:absolute;left:62px;top:138px;display:flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;color:#d0d0d0;font-size:12px}
  .lang i{width:12px;height:12px;border-radius:50%;display:block}
  .tick{position:absolute;background:var(--red);opacity:.7}
  svg.art{position:absolute;left:0;top:0;overflow:visible}
</style>

<body>

    <path d="M1 2.5h5l1.5 1.8H16v8.7H1z"/></svg>

  <!-- ===== BOX C: ACTIVITY ===== -->

    <path d="M0 7h3l1.5-4 2 9 2-11 2 12 2-9 1.5 3H20"/></svg>
  <div class="abs mono shead" style="left:52px;top:645px">ACTIVITY LOG</div>

</div>

<script>
const NS='http://www.w3.org/2000/svg';
const RED='#e3252b', RED2='#ff3a3f';
// deterministic RNG
let seed=1337; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};

/* ---------------- topo contours (hero background) ---------------- */
(function(){
  const W=180,H=44, vals=new Float64Array(W*H);
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
    const x=i/W*9, y=j/H*2.4;
    vals[j*W+i]=Math.sin(x*1.3+Math.cos(y*2.1))*0.9+Math.cos(x*0.7-y*1.7)*0.8+Math.sin((x+y)*2.3)*0.35+Math.cos(x*2.9-y)*0.25;
  }
  const cs=d3.contours().size([W,H]).thresholds(d3.range(-2.2,2.2,0.28))(vals);
  const sx=1280/W, sy=221/H;
  const g=d3.select('#topo').append('g').attr('transform',`translate(0,0) scale(${sx},${sy})`);
  g.selectAll('path').data(cs).enter().append('path').attr('d',d3.geoPath())
    .attr('fill','none').attr('stroke','#ffffff').attr('stroke-opacity',0.10).attr('stroke-width',1/sx*1.1)
    .attr('vector-effect','non-scaling-stroke');
  // fade topo out behind title area
  d3.select('#topo').append('rect').attr('x',0).attr('y',0).attr('width',520).attr('height',221).attr('fill','url(#tfade)');
  const defs=d3.select('#topo').append('defs');
  const lg=defs.append('linearGradient').attr('id','tfade');
  lg.append('stop').attr('offset',0).attr('stop-color','#0d0d0f').attr('stop-opacity',1);
  lg.append('stop').attr('offset',1).attr('stop-color','#0d0d0f').attr('stop-opacity',0);
})();

/* ---------------- globe ---------------- */
fetch('vendor/land.json').then(r=>r.json()).then(topo=>{
  const land=topojson.feature(topo, topo.objects.land);
  const svg=d3.select('#globe');
  const OFFY=200;                     // svg top is -200 relative to panel
  const cx=893, cy=103+OFFY, R=158;
  const proj=d3.geoOrthographic().scale(R).translate([cx,cy]).rotate([28,-14]).clipAngle(90);
  const path=d3.geoPath(proj);
  const defs=svg.append('defs');
  // clip: everything above hero bottom (panel y=220)
  defs.append('clipPath').attr('id','gclip').append('rect').attr('x',0).attr('y',0).attr('width',1280).attr('height',220+OFFY);
  const rg=defs.append('radialGradient').attr('id','gsh').attr('cx','42%').attr('cy','38%').attr('r','65%');
  rg.append('stop').attr('offset',0).attr('stop-color','#1b1a1d');
  rg.append('stop').attr('offset',1).attr('stop-color','#08080a');
  const glow=defs.append('filter').attr('id','glow').attr('x','-200%').attr('y','-200%').attr('width','500%').attr('height','500%');
  glow.append('feGaussianBlur').attr('stdDeviation',2.6).attr('result','b');
  const fm=glow.append('feMerge'); fm.append('feMergeNode').attr('in','b'); fm.append('feMergeNode').attr('in','SourceGraphic');

  const G=svg.append('g').attr('clip-path','url(#gclip)');
  // sphere
  G.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','url(#gsh)');
  // graticule
  G.append('path').datum(d3.geoGraticule().step([15,15])()).attr('d',path)
    .attr('fill','none').attr('stroke','#e9e6e0').attr('stroke-opacity',0.42).attr('stroke-width',0.75);
  // dotted land
  const center=[-28,14];
  const dots=G.append('g').attr('fill','#e6e2da');
  // land mask: rasterize equirectangular once, then O(1) pixel lookups
  const MW=1440, MH=720, mc=document.createElement('canvas'); mc.width=MW; mc.height=MH;
  const mctx=mc.getContext('2d');
  const eq=d3.geoEquirectangular().scale(MW/(2*Math.PI)).translate([MW/2,MH/2]);
  mctx.fillStyle='#fff'; mctx.beginPath(); d3.geoPath(eq,mctx)(land); mctx.fill();
  const mask=mctx.getImageData(0,0,MW,MH).data;
  const isLand=(lon,lat)=>{const x=Math.floor((lon+180)/360*MW), y=Math.floor((90-lat)/180*MH);
    if(x<0||x>=MW||y<0||y>=MH) return false; return mask[(y*MW+x)*4+3]>128;};
  const step=1.35;
  for(let lat=-80;lat<=84;lat+=step){
    const lstep=step/Math.max(0.25,Math.cos(lat*Math.PI/180));
    for(let lon=-180;lon<180;lon+=lstep){
      const p=[lon,lat];
      if(d3.geoDistance(p,center)>Math.PI/2-0.03) continue;
      if(!isLand(lon,lat)) continue;
      const xy=proj(p); if(!xy) continue;
      dots.append('circle').attr('cx',xy[0]).attr('cy',xy[1]).attr('r',0.85).attr('fill-opacity',0.62);
    }
  }
  // outline
  G.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','none').attr('stroke','#f0ece4').attr('stroke-opacity',0.62).attr('stroke-width',1.2);

  // orbits (screen-space ellipses)
  const O=svg.append('g').attr('clip-path','url(#gclip)').attr('fill','none').attr('stroke',RED);
  O.append('ellipse').attr('cx',cx+2).attr('cy',cy+18).attr('rx',222).attr('ry',72).attr('transform',`rotate(-11 ${cx} ${cy})`).attr('stroke-opacity',0.5).attr('stroke-width',1);
  O.append('ellipse').attr('cx',cx+10).attr('cy',cy-4).attr('rx',200).attr('ry',112).attr('transform',`rotate(28 ${cx} ${cy})`).attr('stroke-opacity',0.32).attr('stroke-width',0.9);

  // network: tight constellation over the globe (panel-relative coords, mockup-measured)
  const P=(x,y)=>[x,y+OFFY];
  const nd=[P(733,11),P(790,15),P(772,52),P(813,70),P(706,137),P(955,97),P(1000,110),P(1060,41),P(1048,161),P(868,217),P(1112,136),P(920,150)];
  const N=svg.append('g').attr('clip-path','url(#gclip)');
  const links=[[0,1],[1,3],[3,2],[2,0],[3,5],[5,6],[5,7],[6,8],[3,4],[3,11],[11,9],[11,8],[8,10],[1,7]];
  links.forEach(([a,b])=>N.append('line').attr('x1',nd[a][0]).attr('y1',nd[a][1]).attr('x2',nd[b][0]).attr('y2',nd[b][1])
      .attr('stroke',RED).attr('stroke-opacity',0.8).attr('stroke-width',0.95));
  nd.forEach(p=>N.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',2.7).attr('fill',RED2).attr('filter','url(#glow)'));

  // crosshairs
  [[635,13],[1105,202]].forEach(([x,y])=>{
    svg.append('path').attr('d',`M${x-9} ${y+OFFY}H${x+9}M${x} ${y-9+OFFY}V${y+9+OFFY}`).attr('stroke','#7a2a2d').attr('stroke-width',1);
  });
  document.body.dataset.globe='ok';
});

/* ---------------- iso helpers ---------------- */
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function cube(g,cx,cy,s,red,h){ // screen-centered iso cube, s = half-width
  h=h||s*1.05; const dx=s, dy=s*0.5;
  const top=`M${cx} ${cy-h-dy} L${cx+dx} ${cy-h} L${cx} ${cy-h+dy} L${cx-dx} ${cy-h} Z`;
  const left=`M${cx-dx} ${cy-h} L${cx} ${cy-h+dy} L${cx} ${cy+dy} L${cx-dx} ${cy} Z`;
  const right=`M${cx+dx} ${cy-h} L${cx} ${cy-h+dy} L${cx} ${cy+dy} L${cx+dx} ${cy} Z`;
  const st=red?RED2:'#d9d6d0';
  el('path',{d:left,fill:red?'rgba(227,37,43,.30)':'#17171a',stroke:st,'stroke-width':1},g);
  el('path',{d:right,fill:red?'rgba(227,37,43,.18)':'#111113',stroke:st,'stroke-width':1},g);
  el('path',{d:top,fill:red?'rgba(255,58,63,.42)':'#202024',stroke:st,'stroke-width':1},g);
}
function plate(g,cx,cy,w,t,red,inner){ // flat iso slab, w = half-width
  const dx=w, dy=w*0.5;
  const top=`M${cx} ${cy-dy} L${cx+dx} ${cy} L${cx} ${cy+dy} L${cx-dx} ${cy} Z`;
  const side=`M${cx-dx} ${cy} L${cx} ${cy+dy} L${cx+dx} ${cy} L${cx+dx} ${cy+t} L${cx} ${cy+dy+t} L${cx-dx} ${cy+t} Z`;
  const st=red?RED2:'#cfccc6';
  el('path',{d:side,fill:red?'rgba(227,37,43,.25)':'#121214',stroke:st,'stroke-width':0.9,'stroke-opacity':red?1:.75},g);
  el('path',{d:top,fill:red?'rgba(227,37,43,.22)':'#1a1a1d',stroke:st,'stroke-width':0.9,'stroke-opacity':red?1:.8},g);
  if(inner){const k=0.45; el('path',{d:`M${cx} ${cy-dy*k} L${cx+dx*k} ${cy} L${cx} ${cy+dy*k} L${cx-dx*k} ${cy} Z`,fill:RED,'fill-opacity':.85},g);}
}
function line(g,x1,y1,x2,y2,c,o,w,dash){const a={x1,y1,x2,y2,stroke:c,'stroke-opacity':o??1,'stroke-width':w??1};if(dash)a['stroke-dasharray']=dash;return el('line',a,g);}
function dot(g,x,y,r,c,o){return el('circle',{cx:x,cy:y,r,fill:c,'fill-opacity':o??1},g);}
function target(g,x,y){el('circle',{cx:x,cy:y,r:5,fill:'none',stroke:RED2,'stroke-width':1.1},g);dot(g,x,y,1.8,RED2);}

/* ---------------- cards ---------------- */
const CARDS=[
  {x:10, y:275, no:'01', title:'STORM', chip:'ACTIVE', desc:'Distributed C-UAS sensor grid for multi-node RF detection and direction-finding.', lang:'Python', lc:'#3b7dd8', art:'grid'},
  {x:650,y:275, no:'02', title:'SIGNAL FINDER', chip:'RESEARCH', desc:'Spectrum recon: hunt, classify and chase down unknown emitters.', lang:'Python', lc:'#3b7dd8', art:'wave'},
  {x:10, y:457, no:'03', title:'PHANTOM DRONE', chip:'PROTOTYPE', desc:'HackRF RF decoy that synthesizes real drone signatures for EW training.', lang:'C++', lc:'#f2c94c', art:'net'},
  {x:650,y:457, no:'04', title:'SHADOWLENS', chip:'ACTIVE', desc:'OSINT news intel: CAMEO event coding, GDELT indexing, story clustering.', lang:'Python', lc:'#3b7dd8', art:'stack'},
];
const host=document.getElementById('cards');
var ART={};
ART.grid=function(g){
  // iso ground plane with grid + topo contours (mockup: spans most of the art area)
  const cx=458, cy=88, W=210, H=100;
  const P=(u,v)=>[cx+(u-v)*W/2, cy-H/2+(u+v)*H/2]; // u,v in 0..1 -> diamond
  for(let i=0;i<=14;i++){const t=i/14; const a=P(t,0),b=P(t,1),c2=P(0,t),d2=P(1,t);
    line(g,a[0],a[1],b[0],b[1],'#cfccc6',0.12,0.8); line(g,c2[0],c2[1],d2[0],d2[1],'#cfccc6',0.12,0.8);}
  const corners=[P(0,0),P(1,0),P(1,1),P(0,1)];
  el('path',{d:'M'+corners.map(p=>p.join(' ')).join('L')+'Z',fill:'none',stroke:'#cfccc6','stroke-opacity':.34,'stroke-width':0.9},g);
  // topo contours draped on the plane (iso-squashed wobbly rings)
  const cc=P(0.62,0.38);
  for(let k=1;k<=7;k++){let d='';for(let a=0;a<=360;a+=6){const r=7*k*(1+0.12*Math.sin(a*Math.PI/45+k));
      const x=cc[0]+r*Math.cos(a*Math.PI/180)*1.3, y=cc[1]+r*Math.sin(a*Math.PI/180)*0.62; d+=(a?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}
    el('path',{d:d+'Z',fill:'none',stroke:'#cfccc6','stroke-opacity':0.10,'stroke-width':0.8},g);}
  // halftone dots bottom-left
  for(let i=0;i<7;i++)for(let j=0;j<4;j++)dot(g,322+i*4.5,140+j*4.5,0.8,'#cfccc6',0.25);
  // hatch lines top-right
  [[532,18],[532,25],[532,32]].forEach(([x,y],i)=>{line(g,x,y,x+40,y,'#cfccc6',0.35,0.9); if(i===1)line(g,x+44,y,x+54,y,RED,0.9,1);});
  line(g,530,42,586,42,'#cfccc6',0.2,0.8);
  // network nodes placed on the plane
  const N={top:P(0.08,0.10),left:P(0.12,0.92),right:P(0.90,0.14),bot:P(0.88,0.88)};
  const L=[['top','left'],['top','right'],['left','bot'],['right','bot'],['top','bot']];
  L.forEach(([a,b])=>line(g,N[a][0],N[a][1],N[b][0],N[b][1],RED,0.85,1));
  const mid=(a,b)=>[(N[a][0]+N[b][0])/2,(N[a][1]+N[b][1])/2];
  [mid('top','left'),mid('top','right'),mid('left','bot'),mid('right','bot')].forEach(([x,y])=>dot(g,x,y,2.3,RED2));
  cube(g,N.top[0],N.top[1]+2,12.5,false);
  cube(g,N.left[0],N.left[1]+2,12.5,true);
  cube(g,N.right[0],N.right[1]+2,12.5,false);

/* ---------------- exact text fitting (mockup-measured boxes) ---------------- */
document.fonts.ready.then(()=>{
  const fit=(sel,{x,capTop,capH,width,mode})=>{
    const t=document.querySelector(sel); const cs=getComputedStyle(t);
    const c=document.createElement('canvas').getContext('2d');
    c.font=`${cs.fontWeight} 100px ${cs.fontFamily}`;
    const m=c.measureText(t.textContent);
    const capR=m.actualBoundingBoxAscent/100;
    if(capH){ t.style.fontSize=(capH/capR)+'px'; }
    const fs=parseFloat(getComputedStyle(t).fontSize);
    // line-height:1 -> glyph box height = fs; baseline sits at fontAscent scaled into that box
    const asc=m.fontBoundingBoxAscent/100*fs, desc=m.fontBoundingBoxDescent/100*fs;
    const baselineInBox=(fs-(asc+desc))/2+asc;
    t.style.top=(capTop+capR*fs-baselineInBox)+'px';
    t.style.left=x+'px';
    const nat=t.scrollWidth;
    if(mode==='scale') t.style.transform=`scaleX(${width/nat})`;
    else { const n=t.textContent.length; const ls=parseFloat(cs.letterSpacing)||0; t.style.letterSpacing=(ls+(width-nat)/(n))+'px'; }
  };
  fit('.title',{x:33,capTop:80,capH:50,width:627,mode:'scale'});
  fit('.tagline',{x:34,capTop:146,capH:19,width:517,mode:'spacing'});
  document.body.dataset.fit='ok';
});
