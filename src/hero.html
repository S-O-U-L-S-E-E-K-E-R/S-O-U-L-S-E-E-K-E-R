<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/fonts2.css">
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson.min.js"></script>
<style>
  :root{
    --page:#09090b; --card:#0d0d10; --bd:#2a2a2e; --bd2:#1c1c20;
    --red:#d4202e; --red2:#f61c33; --red3:#ff2740; --redln:#a61325;
    --cream:#f5f0e6; --g1:#9a9a9a; --g2:#7c7c7c; --g3:#56565a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--page)}
  body{width:1300px;height:842px;overflow:hidden}
  #cap{position:relative;width:1300px;height:842px;background:
        radial-gradient(ellipse 58% 52% at 80% 22%, #17141b 0%, #0b0b0d 46%, var(--page) 100%);}
  .abs{position:absolute}
  .mono{font-family:'Share Tech Mono',monospace}

  .kicker{left:300px;top:58px;color:var(--red2);font-size:13px;letter-spacing:7px;font-family:'Share Tech Mono',monospace}
  .title{left:298px;top:70px;font-family:'Saira Stencil One',sans-serif;
         font-size:120px;line-height:1;white-space:nowrap;transform-origin:left top;
         background:linear-gradient(177deg,#d7d4cd 0%,#f3eee3 22%,#faf6ec 52%,#efe9dc 80%,#cfc9bc 100%);
         -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
         filter:drop-shadow(0 2px 1px rgba(0,0,0,.5));}
  .subt{left:303px;top:214px;font-family:'Saira',sans-serif;font-weight:500;color:var(--cream);
        font-size:27px;line-height:1;letter-spacing:11px;white-space:nowrap}
  .tags{left:304px;top:262px;color:var(--g2);font-size:12.5px;letter-spacing:3px;white-space:nowrap}
  .tags b{color:var(--red2);font-weight:400;margin:0 9px 0 0}
  .tags .sp{display:inline-block;width:26px}
  .redbar{left:303px;top:198px;width:54px;height:3px;background:var(--red2);box-shadow:0 0 8px rgba(246,28,51,.6)}

  .shead{color:var(--g1);font-size:11.5px;letter-spacing:3.4px}
  .sright{color:var(--g3);font-size:9px;letter-spacing:1.8px}
  .brk{position:absolute;width:16px;height:16px;border-color:var(--red2);border-style:solid;border-width:0}
  .brk.tl{border-top-width:2px;border-left-width:2px}.brk.tr{border-top-width:2px;border-right-width:2px}
  .brk.bl{border-bottom-width:2px;border-left-width:2px}.brk.br{border-bottom-width:2px;border-right-width:2px}

  /* cards: chamfered tactical panel */
  .card{position:absolute;width:628px;height:152px;background:
        linear-gradient(135deg,#131318 0%,#0b0b0e 62%);
        clip-path:polygon(18px 0, 628px 0, 628px 132px, 610px 152px, 0 152px, 0 18px);overflow:hidden}
  .card .cno{position:absolute;left:22px;top:19px;font-family:'Chakra Petch',sans-serif;font-weight:700;color:var(--red2);font-size:31px;letter-spacing:.5px;line-height:1;text-shadow:0 0 10px rgba(246,28,51,.5)}
  .card .cttl{position:absolute;left:76px;top:23px;font-family:'Chakra Petch',sans-serif;font-weight:700;color:#f3efe6;font-size:24px;letter-spacing:1.6px;white-space:nowrap}
  .card .cttl .sl{color:var(--g3);margin-right:9px;font-weight:600}
  .chip{position:absolute;left:76px;top:62px;height:25px;border:1px solid #9c1a26;border-radius:14px;
        display:flex;align-items:center;gap:9px;padding:0 15px 0 11px;color:var(--red2);font-size:10.5px;letter-spacing:2.6px;background:#170a0c;font-family:'Share Tech Mono',monospace}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--red3);box-shadow:0 0 7px var(--red2);display:block}
  .st-RESEARCH{color:#e8a13a;border-color:#7a521c;background:#17120a}
  .st-RESEARCH i{background:#e8a13a;box-shadow:0 0 7px #e8a13a}
  .st-PROTOTYPE{color:#d94fd4;border-color:#6a2f68;background:#140a14}
  .st-PROTOTYPE i{background:#d94fd4;box-shadow:0 0 7px #d94fd4}
  .st-DORMANT,.st-STANDBY{color:#8f8f92;border-color:#3a3a3d;background:#131315}
  .st-DORMANT i,.st-STANDBY i{background:#8f8f92;box-shadow:none}
  .desc{position:absolute;left:76px;top:98px;width:245px;font-family:'Inter',sans-serif;color:#a8a6a1;font-size:12.6px;line-height:18px}
  .lang{position:absolute;left:76px;top:150px;display:flex;align-items:center;gap:9px;font-family:'Inter',sans-serif;color:#e2e0da;font-size:12.5px;font-weight:500}
  .lang i{width:10px;height:10px;border-radius:50%;background:var(--red3);box-shadow:0 0 7px rgba(246,28,51,.8);display:block}
  .lock{position:absolute;right:18px;top:15px;display:flex;align-items:center;gap:4px;color:#75757a;
        font-family:'Share Tech Mono',monospace;font-size:8.5px;letter-spacing:1.4px}
  .artimg{position:absolute;right:0;top:0;width:318px;height:152px;object-fit:cover;object-position:right center;
          -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 17%);mask-image:linear-gradient(90deg,transparent 0,#000 17%)}
  svg.frame{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}

  .actbox{position:absolute;left:0;top:712px;width:1300px;height:120px;background:#0b0b0e;
          clip-path:polygon(14px 0,1300px 0,1300px 120px,0 120px,0 14px)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="rglow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="rbloom" x="-250%" y="-250%" width="600%" height="600%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="rbig" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="glT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.045"/></linearGradient>
  <linearGradient id="glL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0cdc2" stop-opacity="0.11"/><stop offset="1" stop-color="#d0cdc2" stop-opacity="0.02"/></linearGradient>
  <linearGradient id="glRedT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2740" stop-opacity="0.72"/><stop offset="1" stop-color="#d4202e" stop-opacity="0.4"/></linearGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe2e4"/><stop offset="30%" stop-color="#ff3a4e"/><stop offset="70%" stop-color="#e20c1c" stop-opacity=".6"/><stop offset="100%" stop-color="#8f1420" stop-opacity="0"/></radialGradient>
</defs></svg>
<div id="cap">

  <svg class="abs" style="left:150px;top:4px;opacity:.05" width="760" height="360" viewBox="0 0 200 200" fill="none" stroke="#ffffff" stroke-width="2">
    <path d="M100 18 L150 150 L100 120 L50 150 Z"/><path d="M100 60 L128 150 L100 134 L72 150 Z"/></svg>

  <div class="abs mono kicker">S-O-U-L-S-E-E-K-E-R</div>
  <div class="abs title">SOULSEEKER</div>
  <div class="abs redbar"></div>
  <div class="abs subt">BUILD WHAT DOESN'T EXIST.</div>
  <div class="abs tags mono"><b>//</b>SOFTWARE<span class="sp"></span><b>//</b>HARDWARE<span class="sp"></span><b>//</b>RESEARCH<span class="sp"></span><b>//</b>OPEN SOURCE</div>

  <img id="globe" class="abs" src="art/globe.png" style="left:856px;top:8px;width:444px;height:auto;
       -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%),linear-gradient(0deg,transparent 0,#000 8%);
       -webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 14%);"/>

  <svg class="abs" style="left:14px;top:356px" width="17" height="14" viewBox="0 0 17 14" fill="none" stroke="#9a9a9a" stroke-width="1.3"><path d="M1 2.5h5l1.5 1.8H16v8.7H1z"/></svg>
  <div class="abs mono shead" style="left:40px;top:356px">PROJECT DOSSIERS</div>
  <div class="abs mono" id="latest" style="left:300px;top:359px;color:#6f6f72;font-size:9.5px;letter-spacing:1.2px;white-space:nowrap"></div>
  <div class="abs mono sright" style="left:1196px;top:359px">// ACTIVE WORK</div>

  <div id="cards"></div>

  <div class="actbox"></div>
  <svg class="abs" style="left:16px;top:722px" width="16" height="13" viewBox="0 0 16 13" fill="none" stroke="#f61c33" stroke-width="1.4"><path d="M1 12V7M5 12V3M9 12V9M13 12V1"/></svg>
  <div class="abs mono shead" style="left:42px;top:722px">ACTIVITY</div>
  <div class="abs mono" id="sync" style="left:700px;top:724px;color:#5a5a5e;font-size:9px;letter-spacing:1.2px;white-space:nowrap;text-align:right;width:560px"></div>
  <svg id="cal" class="abs" style="left:0;top:712px" width="1300" height="120"></svg>
  <div class="brk tl" style="left:-1px;top:711px"></div><div class="brk tr" style="left:1285px;top:711px"></div>
  <div class="brk bl" style="left:-1px;top:817px"></div><div class="brk br" style="left:1285px;top:817px"></div>

</div>

<script>
const NS='http://www.w3.org/2000/svg';
const RED='#d4202e', RED2='#f61c33', RED3='#ff2740', REDLN='#a61325';
let seed=1337; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function line(g,x1,y1,x2,y2,c,o,w,dash){const a={x1,y1,x2,y2,stroke:c,'stroke-opacity':o??1,'stroke-width':w??1};if(dash)a['stroke-dasharray']=dash;return el('line',a,g);}
/* ---------------- card frame (chamfered tactical outline) ---------------- */
function frame(svg){
  const W=628,H=152;
  const d=`M18 0 L${W} 0 L${W} 132 L610 ${H} L0 ${H} L0 18 Z`;
  el('path',{d,fill:'none',stroke:'#34343a','stroke-width':1.3},svg);
  // red corner accents
  el('path',{d:'M0 40 L0 70',stroke:RED2,'stroke-width':2},svg);           // left edge segment
  el('path',{d:`M4 ${H-1} L4 ${H-26}`,stroke:RED2,'stroke-width':2},svg);  // bottom-left
  el('path',{d:`M4 ${H-1} L30 ${H-1}`,stroke:RED2,'stroke-width':2},svg);
  el('path',{d:`M${W-1} 40 L${W-1} 66`,stroke:RED2,'stroke-width':2},svg); // right-top
  line(svg,W-46,H-16,W-16,H-16,RED2,0.9,1.4); line(svg,W-40,H-9,W-16,H-9,'#5a5a5e',0.5,1);
}

/* ---------------- cards ---------------- */
const POS=[[10,382],[662,382],[10,544],[662,544]];
const FALLBACK=[
  {id:'01',title:'STORM',status:'DORMANT',classified:true,desc:'Distributed C-UAS sensor grid for multi-node RF detection and direction-finding.',lang:'Python',art:'grid'},
  {id:'02',title:'SIGNAL FINDER',status:'DORMANT',classified:false,desc:'Spectrum recon: hunt, classify and chase down unknown emitters.',lang:'Python',art:'wave'},
  {id:'03',title:'PHANTOM DRONE',status:'DORMANT',classified:true,desc:'HackRF RF decoy that synthesizes real drone signatures for EW training.',lang:'C++',art:'net'},
  {id:'04',title:'SHADOWLENS',status:'DORMANT',classified:true,desc:'OSINT news intel: CAMEO event coding, GDELT indexing, story clustering.',lang:'Python',art:'stack'},
];
const host=document.getElementById('cards');
function buildCards(cards){
  host.innerHTML='';
  cards.forEach((c,i)=>{
    const [x,y]=POS[i]||[10,382];
    const d=document.createElement('div'); d.className='card'; d.style.left=x+'px'; d.style.top=y+'px';
    const lock = c.classified ? `<div class="lock"><svg width="9" height="11" viewBox="0 0 9 11" fill="none" stroke="#75757a" stroke-width="1"><rect x="1" y="4.5" width="7" height="5.5" rx="1"/><path d="M2.5 4.5V3a2 2 0 0 1 4 0v1.5"/></svg>CLASSIFIED</div>` : '';
    d.innerHTML=`<div class="cno">${c.id}</div><div class="cttl"><span class="sl">//</span>${c.title}</div>${lock}
      <div class="chip st-${c.status}"><i></i>${c.status}</div>
      <div class="desc">${c.desc}</div><div class="lang"><i></i>${c.lang}</div>`;
    const img=document.createElement('img'); img.className='artimg'; img.src='art/c0'+(i+1)+'.png'; d.appendChild(img);
    const fsvg=el('svg',{class:'frame',width:628,height:152}); d.appendChild(fsvg); frame(fsvg);
    host.appendChild(d);
  });
}

/* ---------------- fit ---------------- */
document.fonts.ready.then(()=>{
  const fit=(sel,{x,capTop,capH,width,mode})=>{
    const t=document.querySelector(sel); const cs=getComputedStyle(t);
    const c=document.createElement('canvas').getContext('2d'); c.font=`${cs.fontWeight} 100px ${cs.fontFamily}`;
    const m=c.measureText(t.textContent); const capR=m.actualBoundingBoxAscent/100;
    if(capH){ t.style.fontSize=(capH/capR)+'px'; } const fs=parseFloat(getComputedStyle(t).fontSize);
    const asc=m.fontBoundingBoxAscent/100*fs, desc=m.fontBoundingBoxDescent/100*fs; const baselineInBox=(fs-(asc+desc))/2+asc;
    t.style.top=(capTop+capR*fs-baselineInBox)+'px'; t.style.left=x+'px'; const nat=t.scrollWidth;
    if(mode==='scale') t.style.transform=`scaleX(${width/nat})`;
    else { const n=t.textContent.length; const ls=parseFloat(cs.letterSpacing)||0; t.style.letterSpacing=(ls+(width-nat)/(n))+'px'; }
  };
  fit('.title',{x:300,capTop:92,capH:94,width:556,mode:'scale'});
  fit('.subt',{x:303,capTop:206,capH:19,width:474,mode:'spacing'});
  document.body.dataset.fit='ok';
});

/* ---------------- activity ---------------- */
function buildCalendar(weeks){
  const svg=document.getElementById('cal'); const y0=32, py=12.0, cell=9.6;
  [['Mon',1],['Wed',3],['Fri',5]].forEach(([t,r])=>{const e=el('text',{x:16,y:y0+r*py+cell-1,fill:'#8e8e8e','font-size':9.5,'font-family':'Share Tech Mono','letter-spacing':0.5},svg);e.textContent=t;});
  if(!weeks){ weeks=[]; seed=4242; for(let w=0;w<53;w++){const col=[];for(let d=0;d<7;d++){const v=rnd();let l=0;if(v>0.58)l=1;if(v>0.80)l=2;if(v>0.925)l=3;if(v>0.965)l=4;col.push(l);}weeks.push(col);} }
  const n=weeks.length; const x0=56, xEnd=1286, px=(xEnd-x0)/n;
  const SH=['#17110f','#5c1b1f','#9c2429','#d4323a','#ff4d52'];
  weeks.forEach((col,wi)=>{col.forEach((lvl,d)=>{el('rect',{x:x0+wi*px,y:y0+d*py,width:cell,height:cell,rx:1.4,fill:SH[lvl]||SH[0]},svg);});});
}

/* ---------------- data ---------------- */
(async function(){
  let data=null; try{ const r=await fetch('data.json'); if(r.ok) data=await r.json(); }catch(e){}
  const cards=(data&&Array.isArray(data.cards)&&data.cards.length)?data.cards:FALLBACK;
  buildCards(cards);
  buildCalendar(data&&Array.isArray(data.calendar)&&data.calendar.length?data.calendar:null);
  const stars=cards.reduce((a,c)=>a+(c.stars||0),0); const sync=document.getElementById('sync');
  if(sync) sync.textContent=`LAST SYNC ${data&&data.updated?data.updated:'OFFLINE'}   ·   TOTAL ★ ${stars}   ·   FLWRS ${data&&data.followers!=null?data.followers:'—'}`;
  const lat=document.getElementById('latest'), L=(data&&data.latest)||{};
  if(lat && L.repo){ const dt=(L.date||'').slice(0,10); const tail=L.private?'[CLASSIFIED]':(L.msg?('"'+L.msg+'"'):'');
    lat.innerHTML=`<span style="color:#f61c33">// LATEST OP</span>  ${L.repo} · ${dt}  ${tail?'· '+tail:''}`; }
  document.body.dataset.ready='1';
})();
</script>
</body>
</html>
