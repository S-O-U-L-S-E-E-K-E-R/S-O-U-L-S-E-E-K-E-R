  .actbox{position:absolute;left:0;top:712px;width:1300px;height:120px;background:#0b0b0e;
          clip-path:polygon(14px 0,1300px 0,1300px 120px,0 120px,0 14px)}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="rglow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="rbloom" x="-250%" y="-250%" width="600%" height="600%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="rbig" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="glT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.045"/></linearGradient>
  <linearGradient id="glL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0cdc2" stop-opacity="0.11"/><stop offset="1" stop-color="#d0cdc2" stop-opacity="0.02"/></linearGradient>
  <linearGradient id="glRedT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff2740" stop-opacity="0.72"/><stop offset="1" stop-color="#d4202e" stop-opacity="0.4"/></linearGradient>
  <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe2e4"/><stop offset="30%" stop-color="#ff3a4e"/><stop offset="70%" stop-color="#e20c1c" stop-opacity=".6"/><stop offset="100%" stop-color="#8f1420" stop-opacity="0"/></radialGradient>
</defs></svg>

  <svg class="abs" style="left:150px;top:4px;opacity:.05" width="760" height="360" viewBox="0 0 200 200" fill="none" stroke="#ffffff" stroke-width="2">

  <div class="abs mono kicker">S-O-U-L-S-E-E-K-E-R</div>

  <svg id="globe" class="abs" width="1300" height="470" style="left:0;top:-72px;overflow:visible"></svg>

  <svg class="abs" style="left:14px;top:356px" width="17" height="14" viewBox="0 0 17 14" fill="none" stroke="#9a9a9a" stroke-width="1.3"><path d="M1 2.5h5l1.5 1.8H16v8.7H1z"/></svg>

  <svg class="abs" style="left:16px;top:722px" width="16" height="13" viewBox="0 0 16 13" fill="none" stroke="#f61c33" stroke-width="1.4"><path d="M1 12V7M5 12V3M9 12V9M13 12V1"/></svg>
  <div class="abs mono shead" style="left:42px;top:722px">ACTIVITY</div>
  <div class="abs mono" id="sync" style="left:700px;top:724px;color:#5a5a5e;font-size:9px;letter-spacing:1.2px;white-space:nowrap;text-align:right;width:560px"></div>
  <svg id="cal" class="abs" style="left:0;top:712px" width="1300" height="120"></svg>
  <div class="brk tl" style="left:-1px;top:711px"></div><div class="brk tr" style="left:1285px;top:711px"></div>
  <div class="brk bl" style="left:-1px;top:817px"></div><div class="brk br" style="left:1285px;top:817px"></div>

</div>

<script>
const NS='http://www.w3.org/2000/svg';
const RED='#d4202e', RED2='#f61c33', RED3='#ff2740', REDLN='#a61325';
let seed=1337; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function line(g,x1,y1,x2,y2,c,o,w,dash){const a={x1,y1,x2,y2,stroke:c,'stroke-opacity':o??1,'stroke-width':w??1};if(dash)a['stroke-dasharray']=dash;return el('line',a,g);}
function dot(g,x,y,r,c,o){return el('circle',{cx:x,cy:y,r,fill:c,'fill-opacity':o??1},g);}
function rnode(g,x,y,r){ // glowing red node = bloom halo + bright core
  el('circle',{cx:x,cy:y,r:r,fill:RED3,filter:'url(#rbloom)'},g);
  el('circle',{cx:x,cy:y,r:Math.max(1,r*0.45),fill:'#ffe0e3'},g);
}

/* ---------------- globe ---------------- */
fetch('vendor/land.json').then(r=>r.json()).then(topo=>{
  const land=topojson.feature(topo, topo.objects.land);
  const svg=d3.select('#globe');
  const OFFY=72; const cx=1148, cy=164+OFFY, R=144;
  const proj=d3.geoOrthographic().scale(R).translate([cx,cy]).rotate([32,-16]).clipAngle(90);
  const path=d3.geoPath(proj);
  const defs=svg.append('defs');
  const rg=defs.append('radialGradient').attr('id','gsh').attr('cx','42%').attr('cy','38%').attr('r','66%');
  rg.append('stop').attr('offset',0).attr('stop-color','#141317').attr('stop-opacity',0.9);
  rg.append('stop').attr('offset',1).attr('stop-color','#09090b').attr('stop-opacity',0.4);
  const G=svg.append('g');
  G.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','url(#gsh)');
  // graticule (wireframe, brighter)
  G.append('path').datum(d3.geoGraticule().step([12,12])()).attr('d',path)
    .attr('fill','none').attr('stroke','#dcd8d0').attr('stroke-opacity',0.4).attr('stroke-width',0.65);
  // dotted land
  const center=[-32,16]; const dots=G.append('g').attr('fill','#eae6de');
  const MW=1440, MH=720, mc=document.createElement('canvas'); mc.width=MW; mc.height=MH;
  const mctx=mc.getContext('2d'); const eq=d3.geoEquirectangular().scale(MW/(2*Math.PI)).translate([MW/2,MH/2]);
  mctx.fillStyle='#fff'; mctx.beginPath(); d3.geoPath(eq,mctx)(land); mctx.fill();
  const mask=mctx.getImageData(0,0,MW,MH).data;
  const isLand=(lon,lat)=>{const x=Math.floor((lon+180)/360*MW), y=Math.floor((90-lat)/180*MH); if(x<0||x>=MW||y<0||y>=MH)return false; return mask[(y*MW+x)*4+3]>128;};
  const step=1.25;
  for(let lat=-80;lat<=84;lat+=step){const ls=step/Math.max(0.25,Math.cos(lat*Math.PI/180));
    for(let lon=-180;lon<180;lon+=ls){const p=[lon,lat]; if(d3.geoDistance(p,center)>Math.PI/2-0.03)continue; if(!isLand(lon,lat))continue; const xy=proj(p); if(!xy)continue; dots.append('circle').attr('cx',xy[0]).attr('cy',xy[1]).attr('r',0.9).attr('fill-opacity',0.6);}}
  G.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','none').attr('stroke','#efebe3').attr('stroke-opacity',0.6).attr('stroke-width',1.1);

  // orbits (screen-space ellipses) — tilts like mockup
  const orbits=[[210,60,-16,0.75,1.4],[198,104,24,0.55,1.2],[214,140,5,0.4,1.05],[92,196,-8,0.42,1.1],[150,150,0,0.3,0.9]];
  const O=svg.append('g').attr('fill','none');
  orbits.forEach(([rx,ry,rot,op,w])=>O.append('ellipse').attr('cx',cx).attr('cy',cy).attr('rx',rx).attr('ry',ry)
      .attr('transform',`rotate(${rot} ${cx} ${cy})`).attr('stroke',RED).attr('stroke-opacity',op).attr('stroke-width',w).attr('filter','url(#rglow)'));
  // red meridian on globe
  O.append('ellipse').attr('cx',cx).attr('cy',cy).attr('rx',R*0.44).attr('ry',R).attr('transform',`rotate(16 ${cx} ${cy})`).attr('stroke',RED).attr('stroke-opacity',0.5).attr('stroke-width',1).attr('filter','url(#rglow)');

  // polar axis beam + flares
  const AX=svg.append('g');
  line(AX,cx,cy-R-40,cx,cy+R+40,RED3,1,2.1); AX.lastChild.setAttribute('filter','url(#rglow)');
  // bright flares top & bottom and center
  [[cx,cy-R-34,10],[cx,cy+R+34,10],[cx,cy,6]].forEach(([x,y,r])=>{el('circle',{cx:x,cy:y,r,fill:'url(#core)',filter:'url(#rbig)'},AX); el('circle',{cx:x,cy:y,r:2.4,fill:'#fff'},AX);});

  // nodes sampled along orbits + mesh
  const rad=d=>d*Math.PI/180;
  function onEll(rx,ry,rot,a){const x=rx*Math.cos(rad(a)),y=ry*Math.sin(rad(a)),c=Math.cos(rad(rot)),s=Math.sin(rad(rot));return [cx+x*c-y*s, cy+x*s+y*c];}
  const nodes=[];
  orbits.slice(0,4).forEach(([rx,ry,rot],i)=>{for(let k=0;k<5;k++){nodes.push(onEll(rx,ry,rot,k*72+i*23));}});
  const MESH=svg.append('g');
  for(let i=0;i<nodes.length;i++){const a=nodes[i],b=nodes[(i*3+5)%nodes.length];
    line(MESH,a[0],a[1],b[0],b[1],RED,0.42,0.8);}
  const NG=svg.append('g'); nodes.forEach(p=>rnode(NG,p[0],p[1],3));

  // HUD bracket top-right + ticks
  const H=svg.append('g').attr('stroke','#5a5a5e').attr('fill','none');
  line(H,1282,cy-120,1296,cy-120,'#5a5a5e',0.6,1); line(H,1296,cy-120,1296,cy-100,'#5a5a5e',0.6,1);
  document.body.dataset.globe='ok';
});

/* ---------------- iso primitives ---------------- */
function cube(g,cx,cy,s,mode,h){ // mode: 'glass' | 'red'
  h=h||s*1.05; const dx=s, dy=s*0.5; const topY=cy-h;
  const top=`M${cx} ${topY-dy} L${cx+dx} ${topY} L${cx} ${topY+dy} L${cx-dx} ${topY} Z`;
  const left=`M${cx-dx} ${topY} L${cx} ${topY+dy} L${cx} ${cy+dy} L${cx-dx} ${cy} Z`;
  const right=`M${cx+dx} ${topY} L${cx} ${topY+dy} L${cx} ${cy+dy} L${cx+dx} ${cy} Z`;
  if(mode==='red'){
    el('circle',{cx,cy:topY,r:s*1.15,fill:'url(#core)',filter:'url(#rbig)'},g);
    el('path',{d:left,fill:'rgba(166,19,37,.4)',stroke:RED2,'stroke-width':1.1},g);
    el('path',{d:right,fill:'rgba(143,20,32,.26)',stroke:RED2,'stroke-width':1.1},g);
    el('path',{d:top,fill:'url(#glRedT)',stroke:RED3,'stroke-width':1.2,filter:'url(#rglow)'},g);
    el('circle',{cx,cy:topY,r:2,fill:'#ffe6e8'},g);
  }else{
    el('path',{d:left,fill:'url(#glL)',stroke:'#c7c3b8','stroke-width':1,'stroke-opacity':.68},g);
    el('path',{d:right,fill:'rgba(12,12,15,.5)',stroke:'#a4a199','stroke-width':1,'stroke-opacity':.5},g);
    el('path',{d:top,fill:'url(#glT)',stroke:'#e8e4da','stroke-width':1,'stroke-opacity':.82},g);
  }
}
function plate(g,cx,cy,w,t,mode,glow){ // flat iso slab, w=half-width
  const dx=w, dy=w*0.5;
  const top=`M${cx} ${cy-dy} L${cx+dx} ${cy} L${cx} ${cy+dy} L${cx-dx} ${cy} Z`;
  const side=`M${cx-dx} ${cy} L${cx} ${cy+dy} L${cx+dx} ${cy} L${cx+dx} ${cy+t} L${cx} ${cy+dy+t} L${cx-dx} ${cy+t} Z`;
  if(mode==='red'){
    if(glow) el('ellipse',{cx,cy,rx:w*0.9,ry:w*0.5,fill:'url(#core)',filter:'url(#rbig)'},g);
    el('path',{d:side,fill:'rgba(143,20,32,.34)',stroke:RED2,'stroke-width':1},g);
    el('path',{d:top,fill:'url(#glRedT)',stroke:RED3,'stroke-width':1,filter:'url(#rglow)'},g);
  }else{
    el('path',{d:side,fill:'rgba(12,12,15,.55)',stroke:'#b8b4aa','stroke-width':0.95,'stroke-opacity':.55},g);
    el('path',{d:top,fill:'url(#glT)',stroke:'#e6e2d8','stroke-width':0.95,'stroke-opacity':.78},g);
  }
}
function isoGrid(g,cx,cy,W,H,n){ // diamond grid plane
  const P=(u,v)=>[cx+(u-v)*W/2, cy-H/2+(u+v)*H/2];
  for(let i=0;i<=n;i++){const t=i/n; const a=P(t,0),b=P(t,1),c=P(0,t),d=P(1,t);
    line(g,a[0],a[1],b[0],b[1],'#cfccc6',0.12,0.7); line(g,c[0],c[1],d[0],d[1],'#cfccc6',0.12,0.7);}
  const cr=[P(0,0),P(1,0),P(1,1),P(0,1)];
  el('path',{d:'M'+cr.map(p=>p.join(' ')).join('L')+'Z',fill:'none',stroke:'#cfccc6','stroke-opacity':.3,'stroke-width':0.9},g);
  return P;
}
function hud(g,x,y){ // small red tick cluster
  line(g,x,y,x+34,y,'#cfccc6',0.3,0.8); line(g,x,y+6,x+22,y+6,'#cfccc6',0.3,0.8); line(g,x+38,y,x+50,y,RED2,0.9,1.1);
}

/* ---------------- card arts (exact to mockup) ---------------- */
var ART={};
// 01 FIELD SYSTEMS: iso grid plane + glass cubes, two glowing red, drop-lines + junction nodes
ART.grid=function(g){
  const P=isoGrid(g,470,86,208,98,10);
  // vertical red drop-lines from cube tops to plane + base node
  const drops=[[0.2,0.16],[0.52,0.5],[0.86,0.2],[0.74,0.82]];
  drops.forEach(([u,v])=>{const b=P(u,v); line(g,b[0],b[1]-40,b[0],b[1],RED2,0.8,1); rnode(g,b[0],b[1],2.4);});
  // mesh links between cube nodes
  const K={a:P(0.12,0.14),b:P(0.5,0.5),c:P(0.88,0.18),d:P(0.78,0.84),e:P(0.16,0.86)};
  [['a','b'],['b','c'],['b','d'],['a','e'],['c','d']].forEach(([m,n])=>line(g,K[m][0],K[m][1],K[n][0],K[n][1],RED,0.6,0.9));
  // glass cubes
  cube(g,K.a[0],K.a[1]+2,13,'glass'); cube(g,K.e[0],K.e[1]+2,12,'glass'); cube(g,K.d[0],K.d[1]+2,12,'glass');
  // red glowing cubes
  cube(g,K.b[0],K.b[1]+3,15,'red'); cube(g,K.c[0],K.c[1]+2,14,'red');
  // flat plate bottom-left + hud
  plate(g,P(0.05,0.95)[0],P(0.05,0.95)[1],20,4,'glass');
  hud(g,536,20); line(g,560,150,600,150,RED,0.6,1);
};
// 02 SIGNAL LAB: receding glass panels + bright red waveform through them + dot scatter
ART.wave=function(g){
  for(let i=0;i<6;i++){const x=336+i*44, y=22+i*4, w=74, hh=104, sk=16;
    el('path',{d:`M${x} ${y} L${x+w} ${y-sk} L${x+w} ${y-sk+hh} L${x} ${y+hh} Z`,fill:'rgba(255,255,255,.035)',stroke:'#d2cfc6','stroke-opacity':0.28,'stroke-width':0.9},g);}
  // dot scatter
  seed=77; for(let i=0;i<60;i++){const x=330+rnd()*280,y=30+rnd()*110; dot(g,x,y,0.8,RED2,0.5);}
  // waveform (ECG-like) with bloom
  let d='M322 86';
  for(let x=322;x<=612;x+=0.7){
    const e=4+40*Math.exp(-((x-470)**2)/(2*18**2))+26*Math.exp(-((x-432)**2)/(2*7**2))+16*Math.exp(-((x-524)**2)/(2*9**2))+8*Math.exp(-((x-372)**2)/(2*12**2));
    const y=86-e*Math.sin(x*1.02)*(0.82+0.18*Math.sin(x*0.4));
    d+=` L${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  const wv=el('path',{d,fill:'none',stroke:RED3,'stroke-width':1.5,'stroke-opacity':.98,filter:'url(#rbloom)'},g);

/* ---------------- cards ---------------- */
const POS=[[10,382],[662,382],[10,544],[662,544]];

const host=document.getElementById('cards');
function buildCards(cards){

/* ---------------- fit ---------------- */
document.fonts.ready.then(()=>{
  const fit=(sel,{x,capTop,capH,width,mode})=>{
    const t=document.querySelector(sel); const cs=getComputedStyle(t);
    const c=document.createElement('canvas').getContext('2d'); c.font=`${cs.fontWeight} 100px ${cs.fontFamily}`;
    const m=c.measureText(t.textContent); const capR=m.actualBoundingBoxAscent/100;
    if(capH){ t.style.fontSize=(capH/capR)+'px'; } const fs=parseFloat(getComputedStyle(t).fontSize);
    const asc=m.fontBoundingBoxAscent/100*fs, desc=m.fontBoundingBoxDescent/100*fs; const baselineInBox=(fs-(asc+desc))/2+asc;
    t.style.top=(capTop+capR*fs-baselineInBox)+'px'; t.style.left=x+'px'; const nat=t.scrollWidth;
    if(mode==='scale') t.style.transform=`scaleX(${width/nat})`;
    else { const n=t.textContent.length; const ls=parseFloat(cs.letterSpacing)||0; t.style.letterSpacing=(ls+(width-nat)/(n))+'px'; }
  };
  fit('.title',{x:300,capTop:86,capH:110,width:688,mode:'scale'});
  fit('.subt',{x:303,capTop:214,capH:20,width:560,mode:'spacing'});
  document.body.dataset.fit='ok';
});

/* ---------------- activity ---------------- */
function buildCalendar(weeks){
  const svg=document.getElementById('cal'); const y0=32, py=12.0, cell=9.6;
  [['Mon',1],['Wed',3],['Fri',5]].forEach(([t,r])=>{const e=el('text',{x:16,y:y0+r*py+cell-1,fill:'#8e8e8e','font-size':9.5,'font-family':'Share Tech Mono','letter-spacing':0.5},svg);e.textContent=t;});
  if(!weeks){ weeks=[]; seed=4242; for(let w=0;w<53;w++){const col=[];for(let d=0;d<7;d++){const v=rnd();let l=0;if(v>0.58)l=1;if(v>0.80)l=2;if(v>0.925)l=3;if(v>0.965)l=4;col.push(l);}weeks.push(col);} }
  const n=weeks.length; const x0=56, xEnd=1286, px=(xEnd-x0)/n;
  const SH=['#17110f','#5c1b1f','#9c2429','#d4323a','#ff4d52'];
  weeks.forEach((col,wi)=>{col.forEach((lvl,d)=>{el('rect',{x:x0+wi*px,y:y0+d*py,width:cell,height:cell,rx:1.4,fill:SH[lvl]||SH[0]},svg);});});
}

/* ---------------- data ---------------- */
(async function(){
  let data=null; try{ const r=await fetch('data.json'); if(r.ok) data=await r.json(); }catch(e){}
  const cards=(data&&Array.isArray(data.cards)&&data.cards.length)?data.cards:FALLBACK;
  buildCards(cards);
  buildCalendar(data&&Array.isArray(data.calendar)&&data.calendar.length?data.calendar:null);
  const stars=cards.reduce((a,c)=>a+(c.stars||0),0); const sync=document.getElementById('sync');
  if(sync) sync.textContent=`LAST SYNC ${data&&data.updated?data.updated:'OFFLINE'}   ·   TOTAL ★ ${stars}   ·   FLWRS ${data&&data.followers!=null?data.followers:'—'}`;
  const lat=document.getElementById('latest'), L=(data&&data.latest)||{};
  if(lat && L.repo){ const dt=(L.date||'').slice(0,10); const tail=L.private?'[CLASSIFIED]':(L.msg?('"'+L.msg+'"'):'');
    lat.innerHTML=`<span style="color:#f61c33">// LATEST OP</span>  ${L.repo} · ${dt}  ${tail?'· '+tail:''}`; }
  document.body.dataset.ready='1';
})();
