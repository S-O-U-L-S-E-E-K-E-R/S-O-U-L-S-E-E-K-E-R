name: refresh profile hero

on:
  schedule:
    - cron: "17 7 * * *"   # once daily (07:17 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/hero.html"
      - "src/telemetry.html"
      - "scripts/build_profile.py"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-hero
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch live data
        env:
          # PROFILE_TOKEN (optional, read-only) lets the job read PRIVATE repo
          # activity + the contribution calendar. Without it, it falls back to
          # GITHUB_TOKEN (public data only) and still renders cleanly.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_profile.py

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: render panels
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          CH="${{ steps.chrome.outputs.chrome-path }}"
          "$CH" --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
            --allow-file-access-from-files --force-device-scale-factor=2 \
            --virtual-time-budget=20000 --window-size=1300,1000 \
            --screenshot="$PWD/src/_hero.png" "file://$PWD/src/hero.html"
          "$CH" --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
            --allow-file-access-from-files --force-device-scale-factor=2 \
            --virtual-time-budget=15000 --window-size=1300,340 \
            --screenshot="$PWD/src/_tel.png" "file://$PWD/src/telemetry.html"
          convert src/_hero.png -crop 2600x1684+0+0 +repage assets/hero.png
          convert src/_tel.png  -crop 2600x660+0+0  +repage assets/telemetry.png
          rm -f src/_hero.png src/_tel.png

      - name: commit if changed
        run: |
          git config user.name  "profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/hero.png assets/telemetry.png src/data.json
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "chore: refresh profile hero [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X ours -q origin main || true
            if git push -q origin main; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 4
          done
          echo "push failed after retries"; exit 1
