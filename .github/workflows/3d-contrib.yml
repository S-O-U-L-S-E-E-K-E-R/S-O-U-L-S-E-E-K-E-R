name: 3d contribution calendar

on:
  schedule:
    - cron: "30 7 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile-3d-contrib/profile-customize.json"
      - ".github/workflows/3d-contrib.yml"

permissions:
  contents: write

concurrency:
  group: 3d-contrib
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: generate 3D contribution SVG (red theme)
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          # PROFILE_TOKEN (read access to private repos) counts private
          # contributions in the 3D matrix; falls back to the default token.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-contrib/profile-customize.json

      - name: commit if changed
        run: |
          git config user.name  "profile-bot"
          git config user.email "actions@users.noreply.github.com"
          git add profile-3d-contrib/profile-customize.svg
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "chore: refresh 3d contribution calendar [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X ours -q origin main || true
            if git push -q origin main; then echo "pushed (attempt $i)"; exit 0; fi
            sleep 4
          done
          echo "push failed after retries"; exit 1
