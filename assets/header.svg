<svg width="1000" height="340" viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#101012"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <style>
      .title { font-family:'Arial Black','Helvetica Neue',Arial,sans-serif; font-weight:800; }
      .mono  { font-family:'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace; }
    </style>
  </defs>

  <rect x="6" y="6" width="988" height="328" rx="12" fill="url(#bg)" stroke="#3a1715"/>

  <!-- corner brackets -->
  <g stroke="#e4322b" stroke-width="2" fill="none">
    <path d="M22 44 V22 H44"/><path d="M978 44 V22 H956"/>
    <path d="M22 296 V318 H44"/><path d="M978 296 V318 H956"/>
  </g>

  <!-- header labels -->
  <text x="42" y="60" class="mono" font-size="13" letter-spacing="3" fill="#e4322b">CLASSIFIED <tspan fill="#6b6b6b">// DEVELOPER PROFILE</tspan></text>

  <!-- status pill -->
  <rect x="772" y="42" width="186" height="26" rx="13" fill="#0e1410" stroke="#2f4a2f"/>
  <circle cx="790" cy="55" r="4.2" fill="#56d364"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="804" y="59" class="mono" font-size="11" letter-spacing="2" fill="#c9d6c2">STATUS: ONLINE</text>

  <!-- globe -->
  <g transform="translate(838,176)" stroke="#e4322b" fill="none" opacity="0.85">
    <circle r="92" stroke="#7a2420" stroke-width="1.2"/>
    <ellipse rx="92" ry="32" stroke="#7a2420" stroke-width="0.9"/>
    <ellipse rx="92" ry="62" stroke="#5c1c19" stroke-width="0.8"/>
    <ellipse rx="32" ry="92" stroke="#7a2420" stroke-width="0.9"/>
    <ellipse rx="62" ry="92" stroke="#5c1c19" stroke-width="0.8"/>
    <g stroke-width="1.3" opacity="0.9">
      <ellipse rx="112" ry="40" transform="rotate(28)" stroke="#e4322b"/>
      <ellipse rx="118" ry="30" transform="rotate(-18)" stroke="#b02a24"/>
    </g>
    <g fill="#ff5a4e" stroke="none">
      <circle cx="-48" cy="-30" r="2.4"/><circle cx="34" cy="-46" r="2.4"/>
      <circle cx="70" cy="18" r="2.4"/><circle cx="-24" cy="48" r="2.4"/>
      <circle cx="20" cy="30" r="2"/><circle cx="-70" cy="10" r="2"/>
      <circle cx="112" cy="-20" r="2.4"/><circle cx="-100" cy="-28" r="2"/>
    </g>
  </g>

  <!-- title -->
  <text x="40" y="150" class="title" font-size="56" letter-spacing="3" fill="#efe9df">S-O-U-L-S-E-E-K-E-R</text>
  <text x="44" y="190" class="mono" font-size="22" letter-spacing="8" fill="#e4322b">BUILD WHAT DOESN'T EXIST.</text>

  <!-- section labels -->
  <g class="mono" font-size="12" letter-spacing="2" fill="#8a8a8a">
    <text x="44" y="236"><tspan fill="#e4322b">// </tspan>SIGINT</text>
    <text x="168" y="236"><tspan fill="#e4322b">// </tspan>RF / EW</text>
    <text x="312" y="236"><tspan fill="#e4322b">// </tspan>C-UAS</text>
    <text x="440" y="236"><tspan fill="#e4322b">// </tspan>OFFSEC</text>
    <text x="568" y="236"><tspan fill="#e4322b">// </tspan>OPEN SOURCE</text>
  </g>
  <line x1="44" y1="252" x2="700" y2="252" stroke="#2a1513"/>

  <!-- right micro column -->
  <g class="mono" font-size="11" letter-spacing="2" fill="#7a7a7a" text-anchor="end">
    <text x="956" y="276">SIGNALS</text>
    <text x="956" y="292">DON'T</text>
    <text x="956" y="308" fill="#e4322b">LIE.</text>
  </g>
</svg>
